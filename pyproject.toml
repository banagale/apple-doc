[project]
name = "apple-doc"
version = "0.1.0"
description = "Apple developer docs for AI coding agents: an offline, bounded lookup of API declarations and availability from the copy macOS keeps on disk"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Rob Banagale"}
]
keywords = [
    "ai-agents", "coding-agents", "claude-code", "codex", "agent-skills", "llm",
    "apple", "xcode", "macos", "swift", "documentation", "offline", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/banagale/apple-doc"
Repository = "https://github.com/banagale/apple-doc"
Issues = "https://github.com/banagale/apple-doc/issues"

[project.scripts]
apple-doc = "apple_doc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_asset: needs Apple's documentation asset on this Mac (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP031"]  # printf-style formatting is used deliberately
